[workspace]
resolver = "3"
members = ["crates/sectorzero-core", "crates/sectorzero-i18n", "crates/sectorzero-cli", "app/src-tauri"]
exclude = ["third_party/fatfs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
authors = ["SectorZero contributors"]

[workspace.dependencies]
sectorzero-core = { path = "crates/sectorzero-core" }
sectorzero-i18n = { path = "crates/sectorzero-i18n" }
# FAT12/16/32 engine (MIT, rafalh/rust-fatfs).
fatfs = "0.3.6"
# fatfs's own timestamp type converts from chrono's local time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
# IMZ / WLZ are ZIP files.
zip = { version = "9.8", default-features = false, features = ["deflate"] }
# Raw deflate for compressed QCOW2 clusters (already in the tree through zip).
flate2 = "1.1"
# CRC-32 for GPT headers and checksums.
crc32fast = "1.5"
# Image and file checksums (RustCrypto, MIT/Apache-2.0; adler2 is 0BSD/MIT/Apache-2.0).
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
adler2 = "2"
# NTFS reading (MIT OR Apache-2.0, Colin Finck).
ntfs = "0.4"
# Random GUIDs for GPT, VHD, VHDX.
uuid = { version = "1.29", features = ["v4"] }
# NFC/NFD for HFS+ names (MIT OR Apache-2.0).
unicode-normalization = "0.1"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

# fatfs 0.3.6 with one fix (plain "." and ".." entries); see third_party/fatfs/SECTORZERO-PATCH.md.
[patch.crates-io]
fatfs = { path = "third_party/fatfs" }
