[workspace]
resolver = "3"
members = ["crates/sectorzero-core", "crates/sectorzero-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
authors = ["SectorZero contributors"]

[workspace.dependencies]
sectorzero-core = { path = "crates/sectorzero-core" }
# FAT12/16/32 engine (MIT, rafalh/rust-fatfs).
fatfs = "0.3.6"
# fatfs's own timestamp type converts from chrono's local time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
