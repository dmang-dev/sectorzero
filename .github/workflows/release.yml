name: Release

# Push a tag like v0.1.0 to build installers and attach them to a draft release.
# Run it by hand (workflow_dispatch) to build the same files as workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis
            cli: s0.exe
          - name: linux-x64
            os: ubuntu-24.04
            bundles: deb,appimage
            cli: s0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build CLI
        run: cargo build --release --locked -p sectorzero-cli

      - name: Build desktop app
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}

      - name: Collect files
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev-${GITHUB_SHA::7}"
          mkdir -p dist
          stage="s0-${version}-${{ matrix.name }}"
          mkdir "$stage"
          cp "target/release/${{ matrix.cli }}" LICENSE README.md THIRD_PARTY_NOTICES.md "$stage/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "dist/${stage}.zip" "$stage" > /dev/null
            cp target/release/bundle/nsis/*.exe dist/
          else
            tar czf "dist/${stage}.tar.gz" "$stage"
            cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage dist/
          fi
          (cd dist && sha256sum * > "SHA256SUMS-${{ matrix.name }}.txt")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: sectorzero-${{ matrix.name }}
          path: dist/*

      - name: Attach to draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
